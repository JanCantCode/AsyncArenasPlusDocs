site_name: AsyncArenasPlus
site_description: Minecraft area and arena reset plugin for scheduled region restoration, PvP arenas, terrain rotation, and reset countdowns. No WorldEdit or FAWE required.
site_url: https://jancantcode.github.io/AsyncArenasPlusDocs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      fallback_to_build_date: true
      type: date

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Setup and Automatic Resets: getting-started.md
  - Main Features: main-features.md
  - Arena Reset Plugin Comparison: arena-reset-plugin-comparison.md
  - Arena Commands: commands.md
  - Configuration: configuration.md
  - PlaceholderAPI: placeholders.md
  - Migration Guide: migrations.md
  - Troubleshooting: troubleshooting.md
